name: Backend preview build

on:
  push:
    branches:
      - 'preview/**'
  workflow_dispatch:

concurrency:
  group: bg-prices-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test backend
        run: gradle -p backend build --no-daemon --stacktrace
      - name: Validate runtime container image
        run: docker build --tag bg-prices-preview:ci ./backend
      - name: Smoke-test API against migrated PostgreSQL
        run: |
          docker compose up --build -d api
          trap 'docker compose down -v' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health > /tmp/bg-prices-health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"UP"' /tmp/bg-prices-health.json
          docker compose exec -T db psql -U bgprices -d bgprices -v ON_ERROR_STOP=1 < backend/src/main/resources/db/demo/sample_offers_bg_2026-11-12.sql
          curl --fail --silent 'http://localhost:8080/api/v1/prices/catalog?limit=100' | jq -e 'length == 9 and all(.[]; .priceScope == "NATIONAL_ONLINE" and .currency == "EUR" and .verified == true)'
          curl --fail --silent 'http://localhost:8080/api/v1/catalog' | jq -e '[.categories[].retailers[].code] | sort == ["ardes", "ikea", "praktiker"]'
          curl --fail --silent 'http://localhost:8080/api/v1/catalog?locality=Veliko%20Tarnovo' | jq -e '.categories | length == 4'
          curl --fail --silent 'http://localhost:8080/api/v1/localities?query=Ve' | jq -e 'type == "array"'
