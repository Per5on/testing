name: Backend beta validation

on:
  push:
    branches:
      - 'preview/**'
      - 'beta'
  workflow_dispatch:

concurrency:
  group: spestovnik-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test backend
        run: gradle -p backend build --no-daemon --stacktrace
      - name: Validate runtime container image
        run: docker build --tag spestovnik-beta:ci ./backend
      - name: Smoke-test API and imported catalogue
        run: |
          docker compose up --build -d api
          trap 'docker compose down -v' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8080/actuator/health > /tmp/spestovnik-health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"UP"' /tmp/spestovnik-health.json
          docker compose exec -T db psql -U bgprices -d bgprices -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 1 FROM data_sources WHERE code='nsi_ekatte';
          SELECT 1 FROM official_settlements;
          SELECT 1 FROM fuel_price_observations;
          SELECT 1 FROM store_branches WHERE source_type='OFFICIAL_WEBSITE' AND source_verified_at IS NOT NULL;
          SELECT 1 FROM products WHERE category_code='groceries';
          SQL
          curl --fail --silent 'http://localhost:8080/api/v1/catalog?locality=%D0%92%D0%B5%D0%BB%D0%B8%D0%BA%D0%BE%20%D0%A2%D1%8A%D1%80%D0%BD%D0%BE%D0%B2%D0%BE' | jq -e '[.categories[].retailers[].code] | sort == ["ikea", "jysk", "kaufland", "technopolis"]'
          curl --fail --silent 'http://localhost:8080/api/v1/catalog?postalCode=5000' | jq -e '[.categories[].retailers[].code] | sort == ["kaufland"]'
          curl --fail --silent 'http://localhost:8080/api/v1/catalog?postalCode=5002' | jq -e '[.categories[].retailers[].code] | sort == ["jysk"]'
          curl --fail --silent 'http://localhost:8080/api/v1/products?categoryCode=groceries&limit=50' | jq -e '.total >= 20 and (.items | length >= 20)'
          curl --fail --silent 'http://localhost:8080/api/v1/branches?locality=%D0%92%D0%B5%D0%BB%D0%B8%D0%BA%D0%BE%20%D0%A2%D1%8A%D1%80%D0%BD%D0%BE%D0%B2%D0%BE' | jq -e 'length == 4 and all(.[]; .address != null and .sourceUrl != null)'
