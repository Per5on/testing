name: Android preview build

on:
  push:
    branches:
      - 'preview/**'
      - 'beta'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "I approve publishing this beta APK as a GitHub Release"
        required: true
        type: boolean
        default: false

concurrency:
  group: pestelivko-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.1.${{ github.run_number }}.preview
      BG_PRICES_API_BASE_URL: ${{ vars.BG_PRICES_API_BASE_URL || 'https://pestelivko-preview-api.onrender.com/' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build preview APK
        run: |
          gradle -p android assembleDebug --stacktrace \\
            -PAPP_VERSION_CODE="$APP_VERSION_CODE" \\
            -PAPP_VERSION_NAME="$APP_VERSION_NAME" \\
            -PBG_PRICES_API_BASE_URL="$BG_PRICES_API_BASE_URL"
          mkdir -p artifacts
          APK_NAME="Pestelivko-${APP_VERSION_NAME}-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}-beta.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/$APK_NAME"
          {
            echo "App: Пестеливко Beta"
            echo "Version name: $APP_VERSION_NAME"
            echo "Version code: $APP_VERSION_CODE"
            echo "Build number: $GITHUB_RUN_NUMBER"
            echo "Build attempt: $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > artifacts/build-info.txt

      - name: Upload immutable preview artifact
        uses: actions/upload-artifact@v5
        with:
          name: pestelivko-${{ github.run_number }}.merged-preview-attempt-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  publish-release:
    name: Publish approved beta release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download this run's APK artifact
        uses: actions/download-artifact@v5
        with:
          name: pestelivko-${{ github.run_number }}.merged-preview-attempt-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          TAG="beta-0.1.${RUN_NUMBER}-build${RUN_NUMBER}-${SHORT_SHA:0:7}-attempt${RUN_ATTEMPT}"
          gh release create "$TAG" artifacts/*.apk artifacts/build-info.txt \\
            --target "$GITHUB_SHA" \\
            --title "Пестеливко Beta 0.1.${RUN_NUMBER} (build ${RUN_NUMBER})" \\
            --notes "Approved beta APK for commit $GITHUB_SHA.\n\nBuilt by [GitHub Actions run #$RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).\n\nThis is a beta pre-release." \\
            --prerelease
