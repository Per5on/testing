server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
  tomcat:
    threads:
      max: 50
    max-connections: 100
    accept-count: 50

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bgprices}
    username: ${DB_USER:bgprices}
    password: ${DB_PASSWORD:bgprices_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 0
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1500000
  jdbc:
    template:
      query-timeout: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 5

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

