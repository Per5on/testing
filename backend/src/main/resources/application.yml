server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bgprices}
    username: ${DB_USER:bgprices}
    password: ${DB_PASSWORD:bgprices_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

catalog:
  osm:
    initial-delay-ms: ${OSM_INITIAL_DELAY_MS:60000}
    refresh-ms: ${OSM_REFRESH_MS:43200000}
